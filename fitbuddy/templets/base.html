<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="FitBuddy AI Fitness Plan Generator"
    >

    <title>
        {% block title %}FitBuddy{% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}"
    >
</head>

<body>

<header class="site-header">
    <div class="container nav-container">

        <a
            href="/"
            class="brand"
        >
            <span class="brand-icon">💪</span>
            <span>FitBuddy</span>
        </a>

        <nav>
            <a href="/">Generate Plan</a>
            <a href="/view-all-users">Admin</a>
            <a href="/docs">API Docs</a>
        </nav>

    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        <p>
            FitBuddy — AI-assisted fitness planning.
        </p>

        <p class="muted">
            General wellness information only. Consult an appropriate
            professional for individualized medical or dietary advice.
        </p>
    </div>
</footer>

<script
    src="{{ url_for('static', path='app.js') }}"
></script>

</body>
</html>
